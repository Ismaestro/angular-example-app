<sl-dropdown>
  <sl-button
    class="dropdown-button--primary"
    slot="trigger"
    caret
    [attr.aria-label]="translations.selectLanguage"
    >{{
    localeIdText | uppercase
    }}</sl-button
  >
  <div class="dropdown__content-container">
    <div class="dropdown__item-container">
      <a i18n [href]="spanishUrl()">ES-ES</a>
    </div>
    <div class="dropdown__item-container">
      <a i18n [href]="englishUrl()">EN-US</a>
    </div>
  </div>
</sl-dropdown>
