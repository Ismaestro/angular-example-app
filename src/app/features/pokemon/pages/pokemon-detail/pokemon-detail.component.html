<div class="pokemon-search-input__container">
  <app-pokemon-search-input />
</div>

@let pokemon = loadedPokemon();
@if (pokemon) {
  <app-pokemon-battlefield
    [pokemon]="pokemon"
    [pokeballThrown]="pokeballThrown()"
    (catchAnimationEnd)="onCatchAnimationEnd()"
  />
  <div class="pokedex__container">
    <app-pokedex
      [pokemon]="pokemon"
      [battlePhase]="battlePhase()"
      (pokeballThrow)="catchPokemon(pokemon)"
    />
  </div>
} @else if (pokemonResource.error()) {
  <p class="pokemon-detail__error-text">{{ translations.pokemonNotFoundError }}</p>
}
