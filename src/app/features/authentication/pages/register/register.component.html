<main>
  <h1 class="first-heading__title" i18n data-testid="register-title">
    ¡Register and complete your Pokédex!
  </h1>
  <form class="form__container register__form" [formRoot]="registerForm">
    <img
      class="register-form__image"
      alt="pokemon haunter"
      i18n-alt
      ngSrc="angularexampleapp/assets/images/haunter.png"
      width="200"
      height="200"
    />
    <div class="form-control__container">
      <sl-input
        class="input--primary"
        placeholder="Enter your name"
        label="Name"
        size="medium"
        i18n-label
        i18n-placeholder
        appSlInputIconFocus
        trim
        required
        appSlInputControl
        [formField]="registerForm.name"
        [attr.help-text]="translations.fieldRequired"
      >
        <sl-icon name="person" slot="prefix" />
      </sl-input>
    </div>
    <div class="form-control__container">
      <sl-input
        class="input--primary"
        placeholder="Enter your email"
        label="Email"
        size="medium"
        i18n-label
        i18n-placeholder
        appSlInputIconFocus
        lowercase
        trim
        required
        appSlInputControl
        [formField]="registerForm.email"
        [attr.help-text]="translations.emailHelpText"
      >
        <sl-icon name="person-circle" slot="prefix" />
      </sl-input>
    </div>
    <div class="form-control__container">
      <sl-input
        type="password"
        class="input--primary"
        placeholder="Enter your password"
        password-toggle
        label="Password"
        size="medium"
        i18n-label
        i18n-placeholder
        appSlInputIconFocus
        required
        appSlInputControl
        [formField]="registerForm.password"
        [attr.help-text]="translations.passwordHelpText"
      >
        <sl-icon name="lock" slot="prefix" />
      </sl-input>
    </div>
    <div class="form-control__container">
      <sl-input
        type="password"
        class="input--primary"
        placeholder="Retype the password"
        password-toggle
        label="Confirm password"
        size="medium"
        i18n-label
        i18n-placeholder
        appSlInputIconFocus
        required
        appSlInputControl
        [formField]="registerForm.confirmPassword"
        [attr.help-text]="
          registerForm.confirmPassword().touched() && isPasswordsMismatch()
            ? translations.confirmPasswordHelpText
            : ''
        "
      >
        <sl-icon name="lock" slot="prefix" />
      </sl-input>
    </div>
    <div class="form-control__container">
      <sl-input
        type="text"
        class="input--primary"
        placeholder="Type a pokemon"
        label="What's your favourite pokemon?"
        size="medium"
        i18n-label
        i18n-placeholder
        appSlInputIconFocus
        trim
        appSlInputControl
        required
        [formField]="registerForm.favouritePokemonName"
        [attr.help-text]="
          registerForm.favouritePokemonName().touched() && registerForm.favouritePokemonName().invalid()
            ? translations.pokemonHelpText
            : ''
        "
      >
        <sl-icon name="star" slot="prefix" />
        @if (registerForm.favouritePokemonName().pending()) {
          <img
            class="loading__image"
            alt="pokeball"
            slot="suffix"
            i18n-alt
            ngSrc="angularexampleapp/assets/images/pokeball.png"
            width="100"
            height="100"
          />
        }
      </sl-input>
    </div>
    <div class="form-control__container">
      <sl-checkbox
        class="checkbox--primary"
        i18n
        appSlCheckboxControl
        [formField]="registerForm.terms"
        [attr.help-text]="
          registerForm.terms().touched() && registerForm.terms().invalid() ? translations.fieldRequired : ''
        "
      >
        I’ve caught 'em all (the terms and privacy policy) and I’m cool with them!
      </sl-checkbox>
    </div>
    <div class="form-control__container">
      <sl-button
        class="button--primary"
        size="medium"
        pill
        type="submit"
        [disabled]="isLoading()"
        [class.pokemon-appear]="isRegistrationCompleted()"
        [attr.loading]="isLoading() || null"
      >
        <ng-container i18n>Create account</ng-container>
      </sl-button>
    </div>
    <div>
      <p class="form-footer__paragraph">
        <a class="form-footer__link" [routerLink]="authUrls.logIn">
          <ng-container i18n>Do you have an account? Log in</ng-container>
        </a>
      </p>
    </div>
  </form>
</main>
